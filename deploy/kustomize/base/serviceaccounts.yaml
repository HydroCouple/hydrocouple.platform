# The agent's identity: the namespaced Role below, plus (through overlays) the site's
# storage identity. The runners' identity: no Kubernetes API access at all, plus (through
# overlays) their own, narrower storage identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hcp-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hcp-runner
automountServiceAccountToken: false
