# One agent. Two would also be safe, because leases are fenced; Recreate keeps a rollout
# from running both. The target credential comes from the Secret hcp-agent-credential,
# which "hcp target register --kubernetes-secret" prints; it is never in this repository.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hcp-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hcp-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hcp-agent
        hydrocouple.org/role: agent
    spec:
      serviceAccountName: hcp-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: hydrocouple/agent  # each overlay pins the digest
          args: ["agent", "--config", "/etc/hydrocouple/config/agent.json"]
          env:
            - name: HCP_AGENT_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  name: hcp-agent-credential
                  key: credential
          ports:
            - name: gateway
              containerPort: 8081
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/hydrocouple/config
              readOnly: true
            - name: keys
              mountPath: /etc/hydrocouple/keys
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: hcp-agent-config
        - name: keys
          configMap:
            name: hcp-image-keys
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
