[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hydrocouple.platform"
version = "0.1.0.dev0"
description = "Durable, bring-your-own-compute execution platform for SWMM simulations and HydroCouple compositions"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [
    { name = "Caleb Buahin", email = "caleb.buahin@gmail.com" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Hydrology",
]
# The contracts, client and packaging library are the base install so the GUI,
# CLI and a local MCP process can depend on them without the server stack.
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
# Control plane: API, services, dispatcher, reconciler.
server = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic-settings>=2.2",
    "pyjwt[crypto]>=2.8",
]
# Execution agent: runs in the customer's account or site.
agent = [
    "pydantic-settings>=2.2",
]
# Runner: executes approved workflows next to the engine.
runner = [
    "openswmm>=6.0.0a4.dev1",
]
# The gym.evaluate@1 evaluator and the run_platform_study client driver.
gym = [
    "openswmm.gymnasium[spec,platypus]>=0.1.0.dev0",
]
dev = [
    "hydrocouple.platform[server,agent,runner]",
    "pytest>=8.0",
    "ruff==0.15.14",
    # Embedded PostgreSQL for tests, where it publishes wheels.
    "pgserver>=0.1.4; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
]

[project.scripts]
"hcp" = "hydrocouple_platform.cli:main"

[project.urls]
Repository = "https://github.com/HydroCouple/hydrocouple.platform"

[tool.hatch.build.targets.wheel]
packages = ["src/hydrocouple_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs a real PostgreSQL server (HCP_TEST_DATABASE_URL or HCP_TEST_PG_BIN)",
    "engine: runs the real openswmm Solver",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["src/hydrocouple_platform/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
